[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bloodstream-docker"
dynamic = ["version"]
description = "A wrapper for generating Docker and Apptainer commands using regular bloodstream syntax"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
  { name = "The bloodstream developers" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Medical Science Apps."
]

[project.scripts]
bloodstream-docker = "bloodstream_docker.cli:main"

[tool.setuptools.dynamic]
version = { attr = "bloodstream_docker._version.__version__" }

[tool.setuptools.packages.find]
include = ["bloodstream_docker*"]
